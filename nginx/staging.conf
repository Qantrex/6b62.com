# new.6b62.com (branch staging). deploy.sh installs it as conf.d/default.conf.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # The page is one HTML file with inline CSS: no scripts, fonts or other requests.
  add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # The flag. Headers are not part of the 27,490-byte budget, so it can live here.
  add_header X-Flag "6b62{h34d3rs_4r3_n0t_p4rt_0f_th3_byt3s}" always;
  # new.6b62.com is private, for development only: never indexed. The HTML has no robots meta,
  # so both hosts serve the same bytes.
  add_header X-Robots-Tag "noindex, nofollow" always;
  # Browsers keep it 5 min; Cloudflare's edge 1 h, and serves the old copy for up to a day while it refetches.
  # So the Pi sees about one request per hour per Cloudflare location. Purge the cache after a deploy.
  add_header Cache-Control "public, max-age=300, s-maxage=3600, stale-while-revalidate=86400, stale-if-error=604800" always;
  # Never rewrite the body (no sub_filter, no injected snippets): the page must stay exactly 27,490 bytes.
  location / {
    try_files $uri $uri/ =404;
  }
  # security.txt is served on main only
  location /.well-known/ {
    return 404;
  }
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
