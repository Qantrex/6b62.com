# Main nginx config for the 6b62.com container (replaces the image's /etc/nginx/nginx.conf).
# Tuned for "almost always idle": one worker, few connections, no access log (no SD-card writes),
# pre-compressed files (gzip_static, made by deploy.sh) so nginx never compresses at request time.
user  nginx;
worker_processes  1;
error_log  stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections  64;   # only cloudflared connects; it reuses a handful of connections
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;          # Cloudflare's dashboard has the visitor stats
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  30;
    server_tokens off;

    gzip_static   on;           # serve index.html.gz etc. made at deploy time
    gzip_vary     on;
    open_file_cache          max=16 inactive=1h;
    open_file_cache_valid    1h;

    include /etc/nginx/conf.d/*.conf;
}
