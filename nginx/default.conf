server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Browsers keep it 5 min; Cloudflare's edge 1 h (with the Cache Rule in README.md), and serves the old copy for
  # up to a day while it refetches. So the Pi sees about one request per hour per Cloudflare location, not one per visitor.
  add_header Cache-Control "public, max-age=300, s-maxage=3600, stale-while-revalidate=86400, stale-if-error=604800" always;

  location / {
    try_files $uri $uri/ =404;
  }

  location = /.well-known/security.txt {
    default_type text/plain;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
