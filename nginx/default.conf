server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # This site has ONE inline <script> (the Canvas wireframe + shell); fonts are self-hosted (site/fonts/).
  # The CSP is a touch looser than the main 6b62.com site (which is zero-JS) only for that inline script:
  #   - script-src 'unsafe-inline'  -> allows the one inline script.
  #   - style-src  'unsafe-inline'  -> the inline styles and @font-face block.
  #   - font-src   'self'           -> the woff2 files, served from this origin. No external requests at all.
  # STRICTER OPTION (if you keep this long-term): remove 'unsafe-inline' from script-src and replace it
  # with the script's hash:
  #   printf '%s' "<exact bytes between <script> and </script>>" | openssl dgst -sha256 -binary | openssl base64
  #   then: script-src 'sha256-....';
  add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Browsers keep it 5 min; Cloudflare's edge 1 h (with the Cache Rule in README.md), serving stale for a day.
  add_header Cache-Control "public, max-age=300, s-maxage=3600, stale-while-revalidate=86400, stale-if-error=604800" always;

  location / {
    try_files $uri $uri/ =404;
  }

  location = /.well-known/security.txt {
    default_type text/plain;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
