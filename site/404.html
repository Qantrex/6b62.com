<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 · Konstantin Bauer</title>
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <style>
    :root { --bg: #000; --text: #e8e8e8; --muted: #8a8a8a; --link: #444; --accent: #c4a7e7; --strong: #fff;
            --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #fafafa; --text: #161616; --muted: #5f5f5f; --link: #bbb; --accent: #7a4fb8; --strong: #000; }
    }
    html, body { background: var(--bg); }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 20px; color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Noto Sans", Arial, sans-serif;
    }
    h1 { margin: 0 0 8px; font-size: 32px; line-height: 1.1; letter-spacing: -1px; }
    h1::before { content: "#"; margin-right: .4em; font: 400 .7em var(--mono); letter-spacing: 0; vertical-align: .12em; color: var(--accent); opacity: .75; }
    p { margin: 0; color: var(--muted); }
    a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--link); }
    a:hover, a:focus-visible { border-bottom-color: var(--accent); color: var(--strong); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page doesn't exist. <a href="/">Back to the start page</a>.</p>
  </main>
</body>
</html>
